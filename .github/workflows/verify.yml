name: Verify Example

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run synthetic example verification
        run: python examples/verify.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run budget state verification
        run: node examples/verify_state.js
      - name: Check synthetic SVG source
        run: node examples/render_mockup.js --check
